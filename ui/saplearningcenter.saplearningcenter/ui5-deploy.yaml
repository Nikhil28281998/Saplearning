specVersion: "3.1"
metadata:
  name: skillforgetraining
type: application
builder:
  resources:
    excludes:
      - "/test/**"
      - "/localService/**"
  customTasks:
    - name: ui5-task-zipper
      afterTask: generateCachebusterInfo
      configuration:
        archiveName: skillforgetraining # This creates skillforgetraining.zip
