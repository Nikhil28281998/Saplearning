specVersion: "4.0"
metadata:
  name: z.sap.courses
type: application

builder:
  customTasks:
    - name: ui5-task-zipper
      afterTask: generateCachebusterInfo
      configuration:
        archiveName: Z_COURSES

server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
        # Local proxy for S/4 OData services during development
        # Configure S4_HOST, S4_USER, S4_PASSWORD via environment variables
        backend:
          - path: /sap
            url: http://localhost:8080/sap  # Replace with actual S/4 HOST during local testing
            changeOrigin: true

