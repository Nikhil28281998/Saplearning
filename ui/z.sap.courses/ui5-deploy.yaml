specVersion: "3.1"
metadata:
  name: z.sap.courses
type: application

builder:
  customTasks:
    - name: ui5-task-zipper
      afterTask: generateCachebusterInfo
      configuration:
        archiveName: Z_COURSES_UI
        additionalFiles:
          - "xs-app.json"
    - name: deploy-to-abap
      afterTask: ui5-task-zipper
      configuration:
        target:
          destination: S4_ABAP_DEV
        app:
          name: Z_COURSES_UI
          description: SAP Learning Courses Application
          package: $TMP
          transport:

