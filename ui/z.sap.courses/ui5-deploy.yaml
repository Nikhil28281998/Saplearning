specVersion: "3.1"
metadata:
  name: z.sap.courses
type: application

builder:
  customTasks:
    - name: ui5-task-zipper
      afterTask: generateCachebusterInfo
      configuration:
        archiveName: Z_COURSES_UI
        additionalFiles:
          - "xs-app.json"

---
# Deployment configuration for S4HANA ABAP On-Premise
specVersion: "3.1"
metadata:
  name: deploy-to-abap

builder:
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          url: ~{FIORI_TOOLS_ABAP_DEPLOY_URL}
          client: ~{FIORI_TOOLS_ABAP_DEPLOY_CLIENT}
          auth: ~{FIORI_TOOLS_ABAP_DEPLOY_AUTH}
        app:
          name: Z_COURSES_UI
          description: SAP Learning Courses UI
          package: ZTMP
          transport: ~{FIORI_TOOLS_ABAP_DEPLOY_TRANSPORT}

