_schema-version: '3.1'
ID: skillforge-training-platform
version: 1.0.1
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm install --legacy-peer-deps # [FIX] Added flag to prevent ERESOLVE error
        - npx -p @sap/cds-dk cds build --production

modules:
  - name: skillforge-approuter
    type: approuter.nodejs
    path: app
    requires:
      - name: skillforge-auth
      - name: skillforge-repo-runtime
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true

  - name: skillforge-srv
    type: nodejs
    path: gen/srv
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: skillforge-auth
      - name: skillforge-db

  - name: skillforge-db-deployer
    type: hdb
    path: gen/db
    requires:
      - name: skillforge-db

  - name: skillforgetraining
    type: html5
    path: app/saplearningcenter.saplearningcenter
    build-parameters:
      build-result: dist-zip
      builder: custom
      commands:
        - npm install --legacy-peer-deps # [FIX] Added flag here for safety
        - npm run build
        - mkdir -p dist-zip
        - cd dist && npx bestzip ../dist-zip/webapp.zip *
      supported-platforms: []

  - name: skillforge-ui-deployer
    type: com.sap.application.content
    path: .
    requires:
      - name: skillforge-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources
      requires:
        - name: skillforgetraining
          artifacts:
            - webapp.zip
          target-path: resources/

  - name: skillforge-destination-content
    type: com.sap.application.content
    build-parameters:
      no-source: true
    requires:
      - name: skillforge-destination
        parameters:
          content-target: true
      - name: skillforge-repo-host
        parameters:
          service-key:
            name: skillforge-repo-host-key
      - name: skillforge-auth
        parameters:
          service-key:
            name: skillforge-auth-key
    parameters:
      content:
        subaccount:
          destinations:
            - Name: skillforge_auth
              ServiceInstanceName: skillforge-auth
              ServiceKeyName: skillforge-auth-key
              sap.cloud.service: lcap.skillforge-training-platform
            - Name: skillforge_html_repo_host
              ServiceInstanceName: skillforge-repo-host
              ServiceKeyName: skillforge-repo-host-key
              sap.cloud.service: lcap.skillforge-training-platform
          existing_destinations_policy: update

resources:
  - name: skillforge-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: skillforge-training-app
        tenant-mode: dedicated
  - name: skillforge-db
    type: com.sap.xs.hdi-container
  - name: skillforge-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
  - name: skillforge-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
  - name: skillforge-repo-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime