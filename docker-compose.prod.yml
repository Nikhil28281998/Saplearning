  #     - sap-ulhn-network
  #   depends_on:
  #     - backend

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  meilisearch_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  sap-ulhn-network:
    driver: bridge
