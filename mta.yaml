_schema-version: '3.1'
ID: skillforge-training-platform
version: 1.0.0
description: "SkillForge Training Platform - SAP Learning Resource Management"
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx -p @sap/cds-dk cds build --production

modules:
  # --------------------- APPROUTER MODULE ---------------------
  - name: skillforge-approuter
  # ------------------------------------------------------------
    type: approuter.nodejs
    path: app
    parameters:
      disk-quota: 2048M
      memory: 1024M
      buildpack: nodejs_buildpack
      health-check-type: http
      health-check-http-endpoint: /
    build-parameters:
      builder: npm
      ignore:
        - saplearningcenter.saplearningcenter/**
        - default-env.json
        - .gitignore
        - .git/
    requires:
      - name: skillforge-auth
      - name: skillforge-repo-runtime
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true

  # --------------------- SERVER MODULE ------------------------
  - name: skillforge-srv
  # ------------------------------------------------------------
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      disk-quota: 2048M
      memory: 1024M
      health-check-type: http
      health-check-http-endpoint: /health
    build-parameters:
      builder: npm
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: skillforge-auth
      - name: skillforge-db

  # -------------------- DATABASE MODULE -----------------------
  - name: skillforge-db-deployer
  # ------------------------------------------------------------
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
      disk-quota: 1024M
      memory: 512M
    requires:
      - name: skillforge-db

  # --------------------- UI MODULE ----------------------------
  - name: skillforgetraining
  # ------------------------------------------------------------
    type: html5
    path: app/saplearningcenter.saplearningcenter
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build:cf
      supported-platforms: []
    requires:
      - name: skillforge-repo-host
    parameters:
      disk-quota: 256M
      memory: 256M

resources:
  # -------------------- UAA SERVICE ---------------------------
  - name: skillforge-auth
  # ------------------------------------------------------------
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: skillforge-training-app
        tenant-mode: dedicated
        role-collections:
          - name: 'SkillForge_Admin_${space}'
            description: Administrator access to SkillForge
            role-template-references:
              - $XSAPPNAME.Admin
          - name: 'SkillForge_Manager_${space}'
            description: Manager access to SkillForge
            role-template-references:
              - $XSAPPNAME.Manager
          - name: 'SkillForge_User_${space}'
            description: User access to SkillForge
            role-template-references:
              - $XSAPPNAME.User

  # ------------------- HANA SERVICE ---------------------------
  - name: skillforge-db
  # ------------------------------------------------------------
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  # --------------- DESTINATION SERVICE ------------------------
  - name: skillforge-destination
  # ------------------------------------------------------------
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite

  # ------------ HTML5 REPO HOST (UI Deployment) --------------
  - name: skillforge-repo-host
  # ------------------------------------------------------------
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  # ---------- HTML5 REPO RUNTIME (Approuter Serving) ---------
  - name: skillforge-repo-runtime
  # ------------------------------------------------------------
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
