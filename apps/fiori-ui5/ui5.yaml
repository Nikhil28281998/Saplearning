specVersion: "3.0"
metadata:
  name: ulhn-fiori-ui5
type: application
framework:
  name: OpenUI5
  version: 1.128.0
  libraries:
    - name: sap.m
    - name: sap.f
    - name: sap.tnt
    - name: sap.ui.table
    - name: sap.ui.layout
server:
  settings:
    httpPort: 8080
    httpsPort: 8443
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: true
        ui5:
          path: /resources
          url: https://ui5.sap.com
        backend:
          - path: /api
            destination: ULHN_API
          - path: /ai
            destination: ai-destination
builder:
  resources:
    excludes: []
