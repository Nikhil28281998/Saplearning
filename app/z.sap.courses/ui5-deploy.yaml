specVersion: "3.1"
metadata:
  name: z.sap.courses
type: application

builder:
  customTasks:
    - name: ui5-task-zipper
      afterTask: generateCachebusterInfo
      configuration:
        archiveName: Z_COURSES_UI
        additionalFiles:
          - "xs-app.json"

---
# ABAP Deployment Configuration
specVersion: "3.1"
metadata:
  name: deploy-to-abap

builder:
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          url: https://your-s4hana-system:port
          client: "100"
          scp: false
        credentials:
          username: env:S4H_USER
          password: env:S4H_PASSWORD
        app:
          name: Z_COURSES_UI
          description: SAP Learning Courses Application
          package: $TMP
          transport:

